name: Release Windows
run-name: Windows ${{ inputs.version }} (draft=${{ inputs.draft }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag (for example v1.5.10-win.1)'
        required: true
        type: string
      draft:
        description: Save as a draft for review before publishing
        type: boolean
        default: true
      prerelease:
        description: Mark this version as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the default branch and a new version tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || [[ ${#RELEASE_TAG} -gt 80 ]]; then
            echo "::error::Use a version such as v1.5.10-win.1."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG"; then
            echo "::error::This tag already exists. Choose a new version; releases are never overwritten."
            exit 1
          else
            status=$?
            if [[ $status -ne 2 ]]; then exit "$status"; fi
          fi

  build:
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hexen2-windows-x64
          path: dist
      - name: Create release with the tested Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Recheck after the build: never attach binaries to an unrelated tag
          # created while the build was running. gh also rejects an existing release.
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG"; then
            echo "::error::This tag was created during the build. Choose a new version."
            exit 1
          else
            status=$?
            if [[ $status -ne 2 ]]; then exit "$status"; fi
          fi
          (cd dist && sha256sum --check *.sha256)
          cat > "$RUNNER_TEMP/release-notes.txt" <<EOF
          Windows x64 OpenGL build from commit $GITHUB_SHA.

          Download the ZIP, extract it into a new folder, and copy the complete
          data1 folder from your own Hexen II installation beside glh2.exe.
          Start Play-Hexen-II-Borderless.cmd. See README.txt in the ZIP for details.
          Game data, saves, and configuration are not included.

          The .sha256 file verifies the ZIP download. BUILD-INFO.txt identifies
          the exact source commit and links to its source archive.
          EOF
          flags=()
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG - Windows x64" --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.txt" "${flags[@]}"
